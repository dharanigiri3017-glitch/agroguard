<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AgroGuard AI - Scan History</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

    <div class="container">

        <h1>🌱 AgroGuard AI</h1>

        <h2>📋 Scan History</h2>

        <p>
            View your previous crop health scans.
        </p>

        <hr>

        <div id="historyContainer">

            <p>
                Loading scan history...
            </p>

        </div>

        <br>

        <button onclick="openScanner()">
            🔍 Scan New Crop
        </button>

        <button onclick="goDashboard()">
            ← Dashboard
        </button>

    </div>


    <script src="js/history.js"></script>

</body>

</html>
