<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AgroGuard AI - Farmer Registration</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container">

        <h1>🌱 AgroGuard AI</h1>

        <h2>Farmer Registration</h2>

        <p>Create your AgroGuard AI account</p>

        <form id="registerForm">

            <input
                type="text"
                id="name"
                placeholder="Farmer Name"
                required
            >

            <input
                type="tel"
                id="mobile"
                placeholder="Mobile Number"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Email Address"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <input
                type="text"
                id="crop"
                placeholder="Main Crop (Example: Tomato)"
            >

            <button type="submit">
                Register
            </button>

        </form>

        <p id="message"></p>

        <p>
            Already have an account?
            <a href="login.html">Login</a>
        </p>

    </div>

    <script src="js/register.js"></script>

</body>

</html>
