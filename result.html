<!DOCTYPE html>

    <style>

        body {

            background: #f4f8f3;
            margin: 0;

        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 60px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);

        }

        .result {

        }

        .label {

        button {
            display: block;
            margin: 25px auto 0;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
